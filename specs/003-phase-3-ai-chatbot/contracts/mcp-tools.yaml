openapi: 3.1.0
info:
  title: Todo App MCP Tools API
  version: 1.0.0
  description: MCP tools for AI-powered todo operations

servers:
  - url: /api/mcp/tools
    description: MCP tools endpoints base path

paths:
  /todos/add:
    post:
      summary: Add a new todo via MCP tool
      description: Creates a new todo for the authenticated user through the MCP interface
      operationId: addTodoTool
      tags:
        - MCP Tools
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Todo title/content
                  example: "Buy groceries"
                isComplete:
                  type: boolean
                  default: false
                  description: Whether the todo is initially complete
      responses:
        '200':
          description: Todo created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      isComplete:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Title is required"
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - user not authorized for this operation

  /todos/list:
    get:
      summary: List todos via MCP tool
      description: Returns all todos for the authenticated user through the MCP interface
      operationId: listTodosTool
      tags:
        - MCP Tools
      security:
        - SessionCookie: []
      parameters:
        - name: isComplete
          in: query
          schema:
            type: boolean
          description: Optional filter by completion status
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum number of todos to return
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of todos to skip (for pagination)
      responses:
        '200':
          description: List of todos
          content:
            application/json:
              schema:
                type: object
                properties:
                  todos:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        title:
                          type: string
                        isComplete:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        updatedAt:
                          type: string
                          format: date-time
                  total:
                    type: integer
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - user not authorized for this operation

  /todos/{todoId}/update:
    patch:
      summary: Update a todo via MCP tool
      description: Updates an existing todo through the MCP interface
      operationId: updateTodoTool
      tags:
        - MCP Tools
      security:
        - SessionCookie: []
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Todo ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Updated todo title
                isComplete:
                  type: boolean
                  description: Updated completion status
      responses:
        '200':
          description: Todo updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      isComplete:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Validation error
        '404':
          description: Todo not found or not owned by user
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - user not authorized for this operation

  /todos/{todoId}/delete:
    delete:
      summary: Delete a todo via MCP tool
      description: Deletes an existing todo through the MCP interface
      operationId: deleteTodoTool
      tags:
        - MCP Tools
      security:
        - SessionCookie: []
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Todo ID to delete
      responses:
        '204':
          description: Todo deleted successfully (no content)
        '404':
          description: Todo not found or not owned by user
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - user not authorized for this operation

  /todos/{todoId}/complete:
    post:
      summary: Complete a todo via MCP tool
      description: Marks a todo as complete through the MCP interface
      operationId: completeTodoTool
      tags:
        - MCP Tools
      security:
        - SessionCookie: []
      parameters:
        - name: todoId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Todo ID to complete
      responses:
        '200':
          description: Todo completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  todo:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      title:
                        type: string
                      isComplete:
                        type: boolean
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '404':
          description: Todo not found or not owned by user
        '401':
          description: Not authenticated
        '403':
          description: Forbidden - user not authorized for this operation

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HTTP-only session cookie for authentication