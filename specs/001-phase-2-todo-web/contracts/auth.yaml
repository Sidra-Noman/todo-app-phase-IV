openapi: 3.1.0
info:
  title: Todo App Authentication API
  version: 1.0.0
  description: API for user registration and sign-in

servers:
  - url: /api/auth
    description: Authentication endpoints base path

paths:
  /signup:
    post:
      summary: Register a new user account
      description: Creates a new user account with email and password
      operationId: signup
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - passwordConfirm
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 255
                  description: User's email address
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: User's password
                  example: securePassword123
                passwordConfirm:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Password confirmation (must match password)
                  example: securePassword123
      responses:
        '201':
          description: User successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Account created successfully
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Email already registered
        '422':
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation error

  /signin:
    post:
      summary: Sign in to existing account
      description: Authenticates user and creates session
      operationId: signin
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                  example: user@example.com
                password:
                  type: string
                  description: User's password
                  example: securePassword123
      responses:
        '200':
          description: Successfully authenticated
          description: Sets HTTP-only session cookie and redirects
          headers:
            Set-Cookie:
              description: Session cookie for authenticated requests
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid email or password
        '422':
          description: Invalid request body

  /signout:
    post:
      summary: Sign out from current session
      description: Clears session and signs user out
      operationId: signout
      tags:
        - Authentication
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Successfully signed out
          headers:
            Set-Cookie:
              description: Clears session cookie
        '401':
          description: Not authenticated

  /me:
    get:
      summary: Get current authenticated user
      description: Returns the currently authenticated user's information
      operationId: getCurrentUser
      tags:
        - Authentication
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current user information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      createdAt:
                        type: string
                        format: date-time
        '401':
          description: Not authenticated

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: HTTP-only session cookie for authentication
