apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app-backend.fullname" . }}-secrets
  labels:
    {{- include "todo-app-backend.labels" . | nindent 4 }}
type: Opaque
data:
  # These should be base64 encoded values
  # Example: echo -n 'your-secret-value' | base64
  cohere-api-key: <base64_encoded_cohere_key>
  better-auth-secret: <base64_encoded_auth_secret>
  database-password: <base64_encoded_db_password>
  jwt-secret: <base64_encoded_jwt_secret>
  encryption-key: <base64_encoded_encryption_key>