apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-frontend-network-policy
  labels:
    {{- include "todo-app-frontend.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "todo-app-frontend.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx  # Or your ingress controller
    ports:
    - protocol: TCP
      port: 3000
  - from:
    - podSelector:
        matchLabels:
          {{- include "todo-app-backend.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 3000  # For health checks
  egress:
  - to:
    - podSelector:
        matchLabels:
          {{- include "todo-app-backend.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53